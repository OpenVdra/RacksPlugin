name: Release

# Two ways to release:
#   1. Publish a GitHub Release (drafts do NOT trigger this — you must click "Publish").
#   2. Run it by hand from the Actions tab ("Run workflow"). In that case the workflow
#      auto-creates the tag + GitHub Release from the Gradle version if one doesn't exist
#      yet, so you don't have to create a tag first.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the tag/release and attach the built jar

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadow jar
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Resolve version and jar path
        id: meta
        run: |
          VERSION=$(./gradlew properties -q --no-daemon | grep "^version:" | awk '{print $2}')
          JAR=$(ls build/libs/Racks-*.jar | grep -v -- '-plain' | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      # Resolve the release notes, in priority order:
      #   1. the section for this version in CHANGELOG.md (the `## <version> - <date>`
      #      block, keep-a-changelog style) — this is the normal path: keep CHANGELOG.md
      #      up to date and the notes flow automatically;
      #   2. the body of an already-published GitHub Release (UI publish);
      #   3. a fallback line.
      - name: Resolve changelog
        id: changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          BODY=""
          if [ -f CHANGELOG.md ]; then
            # Print everything between `## <version> ...` and the next `## ` heading,
            # then strip leading/trailing blank lines.
            BODY=$(awk -v ver="$VERSION" '
              /^## / { if (found) exit; if ($2 == ver) { found=1; next } }
              found { print }
            ' CHANGELOG.md | awk 'NF {p=1} p' | tac | awk 'NF {p=1} p' | tac)
          fi
          if [ -z "$BODY" ]; then
            BODY="$RELEASE_BODY"
          fi
          if [ -z "$BODY" ]; then
            BODY="See the GitHub release for details."
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            echo "$BODY"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Make sure a GitHub Release (and its tag) exists for this version. On a
      # `release: published` event it already does — we just take its tag. On a manual
      # `workflow_dispatch` run we create the tag + Release from the Gradle version (using
      # the changelog resolved above) if it isn't there yet, so "Run workflow" is enough to
      # cut a release. The tag is the bare version (e.g. 1.0.1), no "v" prefix, which is what
      # the in-game update checker expects to read back. Creating a release with GITHUB_TOKEN
      # does not re-trigger this workflow, so there is no double publish.
      - name: Ensure GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$VERSION"
            if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$TAG" --repo "$REPO" --target "${{ github.ref_name }}" \
                --title "Racks $VERSION" --notes "$CHANGELOG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach jar to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "${{ steps.meta.outputs.jar }}" --clobber --repo "${{ github.repository }}"
