# Everything here applies on /racks reload unless marked NEED RESTART.
# Player messages live in language/<locale>/messages.yml, not in this file.

# Language used for players whose own language has no file, and for text with no single reader,
# such as a rack lying on the ground. Must match a folder name under language/.
language: en_US

# Show each player messages in their own game language. Only languages with a folder under
# language/ can be shown; everyone else falls back to the language above.
language-auto-detect: true

database:
  # NEED RESTART:
  # SQLite file inside plugins/Racks/. Holds every placed rack and what is on it.
  # Back it up with the world. Without it, placed racks and their items are gone.
  file: racks.db

settings:
  # true: wall racks stay up after the block behind them is gone, and the check below stops running.
  # false: they drop themselves and their items, the way a painting does.
  ignore-wall-rack-support: false

  # How often wall racks check the block behind them, in ticks. 20 ticks is one second.
  # Higher means less work for the server and a longer wait before a rack falls.
  wall-support-check-interval: 10

# Check the matching plugin before letting a player break a rack or swap its item.
# Each is ignored when that plugin is not installed. Putting a rack down is a normal block
# placement, so both plugins already cover it whatever these are set to.
protection:
  # Regions: needs the block-break flag to break, the interact flag to swap or turn.
  worldguard: true
  # Claims: needs Build trust to break, Container trust to swap or turn.
  griefprevention: true

# Import racks the Racks data pack left standing, as their chunks load. Remove the data pack
# before starting the server, or the two fight over the same racks.
adopt-datapack-racks: false

# Register the twelve crafting recipes. Off means racks come only from /racks give or your own
# loot tables.
recipes-enabled: true

# NEED RESTART:
# Look up the newest release once at startup and tell operators, in chat and in the console, when
# a newer one exists. Nothing is downloaded or installed. Off stops the lookup entirely.
update-checker: true
